smplphotoalbum:
  version: 1.x
  css:
    state:
      css/smplphotoalbum.theme.css: {}
      js/sweetalert2/sweetalert2.min.css: {}
  js:
    js/sweetalert2/sweetalert2.all.min.js: {}
    js/lib.js: { preprocess: false }
    js/smpl.js: { preprocess: false }
    js/exif.js: {}
    js/filter.js: {}
    js/test.js: {}

  dependencies:
    - core/jquery
    - jquery_ui/core
    - jquery_ui_resizable/resizable
    - jquery_ui_draggable/draggable
    - core/once
    - core/drupal
    - core/drupal.ajax

smplphotoalbum-edit:
  version: 1.x
  js:
    js/mousewheel/jquery.mousewheel.min.js: {}
    js/jcanvas/dist/min/jcanvas.min.js: {}
    js/jcanvas/dist/min/jcanvas-handles.min.js: {}
    js/delete.js: {}
    js/edit.js: {}
    js/upload.js: {}
    js/folder.js: {}
    js/editpath.js: {}
    js/img_eyedrop.js: { preprocess: false }
    js/img_distortion.js: { preprocess: false }
    js/img_rect.js: { preprocess: false }
    js/img_ellipse.js: { preprocess: false }
    js/img_circ.js: { preprocess: false }
    js/img_grid.js: { preprocess: false }
    js/img_point.js: { preprocess: false }
    js/img_init.js: { preprocess: false }
    js/img_edit.js: { preprocess: false }
    js/img_effects.js: { preprocess: false }
    js/img_zoomdrag.js: { preprocess: false }

  dependencies:
    - core/jquery
    - jquery_ui/core
    - jquery_ui_resizable/resizable
    - jquery_ui_draggable/draggable
    - core/once
    - core/drupal
    - core/drupal.ajax
    - core/drupal.message

smplphotoalbum-slide:
  version: 1.x
  js:
    js/slide.js: { preprocess: false }
    #js/slide.js: {}

  dependencies:
    - core/jquery
    - jquery_ui/core
    - core/once
    - core/drupal
    - core/drupal.ajax

smplphotoalbum-stat:
  version: 1.x
  js:
    #js/statistics.js: {preprocess: false}
    js/statistics.js: {}

  dependencies:
    - core/jquery
    - core/drupal.ajax
